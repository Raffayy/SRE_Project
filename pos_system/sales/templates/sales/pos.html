{% extends 'base.html' %}

{% block header %}Point of Sale{% endblock %}

{% block content %}
<div class="row">
    <!-- Item Selection -->
    <div class="col-md-8">
        <div class="card h-100">
            <div class="card-header bg-white">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control" placeholder="Search items..." id="itemSearch">
                </div>
            </div>
            <div class="card-body overflow-auto" style="max-height: 600px;">
                <div class="row row-cols-1 row-cols-md-3 g-3" id="itemsGrid">
                    {% for item in items %}
                    <div class="col item-card" data-name="{{ item.name|lower }}">
                        <div class="card h-100 border-0 shadow-sm item-btn"
                            onclick="addToCart({{ item.id }}, '{{ item.name }}', {{ item.price }})">
                            <div class="card-body text-center">
                                <div class="display-4 mb-2"><i class="bi bi-box"></i></div>
                                <h6 class="card-title">{{ item.name }}</h6>
                                <p class="card-text text-primary fw-bold">${{ item.price }}</p>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <!-- Cart -->
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-cart3"></i> Current Sale</h5>
            </div>
            <div class="card-body d-flex flex-column">
                <div class="table-responsive flex-grow-1">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cartBody">
                            <!-- Cart items will go here -->
                        </tbody>
                    </table>
                </div>

                <div class="border-top pt-3 mt-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tax (10%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold fs-4">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>

                    <button class="btn btn-success w-100 mt-3 py-2" onclick="processSale()">
                        <i class="bi bi-check-circle"></i> Complete Sale
                    </button>
                    <button class="btn btn-outline-danger w-100 mt-2" onclick="clearCart()">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let cart = {};

    function addToCart(id, name, price) {
        if (cart[id]) {
            cart[id].quantity++;
        } else {
            cart[id] = {
                id: id,
                name: name,
                price: parseFloat(price),
                quantity: 1
            };
        }
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const tbody = document.getElementById('cartBody');
        tbody.innerHTML = '';

        let subtotal = 0;

        for (const id in cart) {
            const item = cart[id];
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;

            const row = `
                <tr>
                    <td>${item.name}</td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" onclick="updateQty(${id}, -1)">-</button>
                            <span class="btn btn-light disabled">${item.quantity}</span>
                            <button class="btn btn-outline-secondary" onclick="updateQty(${id}, 1)">+</button>
                        </div>
                    </td>
                    <td>$${itemTotal.toFixed(2)}</td>
                    <td><button class="btn btn-sm text-danger" onclick="removeItem(${id})">&times;</button></td>
                </tr>
            `;
            tbody.innerHTML += row;
        }

        const tax = subtotal * 0.10;
        const total = subtotal + tax;

        document.getElementById('subtotal').textContent = '$' + subtotal.toFixed(2);
        document.getElementById('tax').textContent = '$' + tax.toFixed(2);
        document.getElementById('total').textContent = '$' + total.toFixed(2);
    }

    function updateQty(id, change) {
        if (cart[id]) {
            cart[id].quantity += change;
            if (cart[id].quantity <= 0) {
                delete cart[id];
            }
            updateCartDisplay();
        }
    }

    function removeItem(id) {
        delete cart[id];
        updateCartDisplay();
    }

    function clearCart() {
        cart = {};
        updateCartDisplay();
    }

    function processSale() {
        if (Object.keys(cart).length === 0) {
            alert('Cart is empty!');
            return;
        }

        const items = Object.values(cart).map(item => ({
            item_id: item.id,
            quantity: item.quantity
        }));

        fetch('{% url "pos" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({ items: items })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Sale completed successfully! ID: ' + data.sale_id);
                    clearCart();
                } else {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred processing the sale.');
            });
    }

    // Search filter
    document.getElementById('itemSearch').addEventListener('keyup', function () {
        const query = this.value.toLowerCase();
        document.querySelectorAll('.item-card').forEach(card => {
            const name = card.dataset.name;
            if (name.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    });
</script>
{% endblock %}
