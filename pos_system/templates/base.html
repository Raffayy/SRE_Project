<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SG Technologies POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
            color: white;
        }

        .sidebar a {
            color: rgba(255, 255, 255, .8);
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }

        .sidebar a:hover {
            color: white;
            background-color: rgba(255, 255, 255, .1);
        }

        .sidebar .active {
            background-color: #0d6efd;
            color: white;
        }

        .main-content {
            padding: 20px;
        }

        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, .075);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center border-bottom border-secondary">
                    <h4>SG Tech POS</h4>
                    <small>v2.0 Reengineered</small>
                </div>
                <div class="py-3">
                    <a href="{% url 'dashboard' %}"
                        class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                    <a href="{% url 'pos' %}" class="{% if 'sales' in request.path %}active{% endif %}">
                        <i class="bi bi-cart me-2"></i> Point of Sale
                    </a>
                    <a href="{% url 'inventory_list' %}" class="{% if 'inventory' in request.path %}active{% endif %}">
                        <i class="bi bi-box-seam me-2"></i> Inventory
                    </a>
                    <a href="{% url 'employee_list' %}" class="{% if 'employees' in request.path %}active{% endif %}">
                        <i class="bi bi-people me-2"></i> Employees
                    </a>
                    <a href="{% url 'return_list' %}" class="{% if 'returns' in request.path %}active{% endif %}">
                        <i class="bi bi-arrow-counterclockwise me-2"></i> Returns
                    </a>
                    <a href="{% url 'rental_list' %}" class="{% if 'rentals' in request.path %}active{% endif %}">
                        <i class="bi bi-clock-history me-2"></i> Rentals
                    </a>
                    <div class="border-top border-secondary my-3"></div>
                    <a href="/admin/">
                        <i class="bi bi-gear me-2"></i> Admin Panel
                    </a>
                </div>
            </div>
            <div class="col-md-10 main-content">
                <nav class="navbar navbar-light bg-white mb-4 shadow-sm rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">{% block header %}Dashboard{% endblock %}</span>
                        <div class="d-flex align-items-center">
                            <span class="me-3">Welcome, User</span>
                            <button class="btn btn-outline-secondary btn-sm">Logout</button>
                        </div>
                    </div>
                </nav>

                {% if messages %}
                <div class="messages mb-4">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
